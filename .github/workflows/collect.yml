# Ciclo periódico del Signal Engine contra la DB compartida (Supabase).
#
# Se activa solo cuando existe el secret DATABASE_URL. Es la única recolección activa: el launchd
# local (scripts/schedule-local.sh) queda para desarrollo contra el Docker de cada uno.
#
# Secrets del repo (Settings → Secrets and variables → Actions):
#   DATABASE_URL     postgresql+asyncpg://… del *session pooler* de Supabase (puerto 5432).
#                    No usar el transaction pooler (6543): rompe el advisory lock del job.
#   YOUTUBE_API_KEY
name: collect

on:
  schedule:
    - cron: "15 */2 * * *" # cada 2 h, en el minuto 15 (los :00 de GitHub van saturados)
  workflow_dispatch:
    inputs:
      days:
        description: Ventana en días
        default: "7"

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      APP_ENV: ci
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Skip if the shared DB is not configured
        id: guard
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL no configurado; se omite."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: astral-sh/setup-uv@v6
        if: steps.guard.outputs.skip != 'true'

      # Sin grupos por defecto: `ml` (torch) solo lo usa `analyze`, y `dev` no hace falta aquí.
      # `--no-sync` en cada paso evita que `uv run` vuelva a instalarlos.
      - name: Install
        if: steps.guard.outputs.skip != 'true'
        run: uv sync --frozen --no-default-groups

      - name: Migrate
        if: steps.guard.outputs.skip != 'true'
        run: uv run --no-sync alembic upgrade head

      - name: Seed sources
        if: steps.guard.outputs.skip != 'true'
        run: uv run --no-sync python -m app.jobs.seed_sources

      - name: Collect
        if: steps.guard.outputs.skip != 'true'
        run: uv run --no-sync python -m app.jobs.collect --days "${{ inputs.days || '7' }}"
