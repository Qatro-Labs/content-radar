# Ciclo periódico del Signal Engine contra la DB compartida (Supabase).
#
# Se activa solo cuando existe el secret DATABASE_URL. Es la única recolección activa: el launchd
# local (scripts/schedule-local.sh) queda para desarrollo contra el Docker de cada uno.
#
# Secrets del repo (Settings → Secrets and variables → Actions):
#   DATABASE_URL     postgresql+asyncpg://… del *session pooler* de Supabase (puerto 5432).
#                    No usar el transaction pooler (6543): rompe el advisory lock del job.
#   YOUTUBE_API_KEY
#
# Los secrets van en el env de cada paso que los usa, nunca en el del job: así ninguna acción de
# terceros los recibe. Las acciones se fijan por SHA, con la versión en un comentario.
name: collect

on:
  schedule:
    - cron: "15 */2 * * *" # cada 2 h, en el minuto 15 (los :00 de GitHub van saturados)
  workflow_dispatch:
    inputs:
      days:
        description: Ventana en días
        default: "7"

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: ci
      # El CDN de WordPress.com (Import AI, Stratechery, Hipertextual) responde 403 a la huella
      # TLS del Python que descarga uv desde los runners; con el Python del sistema responde 200.
      UV_PYTHON_PREFERENCE: only-system
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Skip if the shared DB is not configured
        id: guard
        working-directory: .
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL no configurado; se omite."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: steps.guard.outputs.skip != 'true'

      # Sin grupos por defecto: `ml` (torch) solo lo usa `analyze`, y `dev` no hace falta aquí.
      # `--no-sync` en cada paso evita que `uv run` vuelva a instalarlos.
      - name: Install
        if: steps.guard.outputs.skip != 'true'
        run: uv sync --frozen --no-default-groups

      - name: Migrate
        if: steps.guard.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run --no-sync alembic upgrade head

      - name: Seed sources
        if: steps.guard.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: uv run --no-sync python -m app.jobs.seed_sources

      # El input llega por env y no interpolado en el script: un valor con comillas no puede
      # inyectar comandos.
      - name: Collect
        if: steps.guard.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DAYS: ${{ inputs.days || '7' }}
        run: uv run --no-sync python -m app.jobs.collect --days "$DAYS"
