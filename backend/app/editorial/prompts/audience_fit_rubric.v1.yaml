# Rúbrica del audience fit (CLAUDE.md §7). El LLM evalúa cada tema completo en los 6 criterios:
# primero la justificación, citando URLs de la evidencia, y después el nivel 0–5.
# Cada nivel describe algo observable en la evidencia (títulos y descripciones), sin solapes entre
# niveles vecinos: con niveles ambiguos el modelo duda y puntúa al azar entre ellos.
# BORRADOR para aprobar. Los ids coinciden con `FitCriterion` (app/schemas/opportunity.py).
version: 1
criteria:
  - id: business_impact
    name: Impacto en decisiones empresariales
    question: ¿Cambia este tema alguna decisión que tome un directivo (inversión, estrategia, contratación, compras, riesgo)?
    levels:
      0: No tiene relación con decisiones de empresa (curiosidad, entretenimiento, ciencia básica).
      1: Afecta a empresas solo de forma indirecta o a muy largo plazo; ninguna pieza lo conecta con una decisión.
      2: Las piezas mencionan efectos en empresas, pero genéricos ("cambiará los negocios") y sin decisión concreta.
      3: Al menos una pieza conecta el tema con una decisión concreta (adoptar, comprar, regular, invertir), sin datos de impacto.
      4: Varias piezas muestran una decisión concreta con datos de impacto (costes, ahorros, ingresos, riesgos cuantificados).
      5: El tema obliga a decidir ahora (cambio regulatorio, de precios o competitivo con fecha) y la evidencia lo cuantifica.
  - id: org_application
    name: Aplicación real en organizaciones
    question: ¿Hay organizaciones concretas que ya aplican esto?
    levels:
      0: No hay aplicación en organizaciones; es investigación, opinión o un producto sin usuarios.
      1: Solo se habla de usos posibles o futuros, sin ninguna organización que lo aplique.
      2: Solo el proveedor que lo lanza cuenta cómo se usaría; ningún cliente lo usa todavía.
      3: Una organización concreta (que no es el proveedor) lo aplica, sin resultados medidos.
      4: Una o más organizaciones lo aplican y dan resultados medidos.
      5: Varias organizaciones de sectores distintos lo aplican con resultados medidos, o una de LATAM con resultados.
  - id: exec_readability
    name: Comprensible para directivos no técnicos
    question: ¿Un directivo sin perfil técnico entiende de qué va el tema y por qué importa?
    levels:
      0: Solo se entiende con formación técnica (código, arquitecturas, benchmarks).
      1: La mayoría de las piezas usan jerga técnica y ninguna explica el tema en términos de negocio.
      2: Hay jerga técnica, pero alguna pieza explica el tema en términos generales.
      3: Se entiende en términos generales; traducirlo a negocio requiere trabajo editorial notable.
      4: La mayoría de las piezas lo explican con vocabulario de negocio o de prensa general.
      5: Se entiende sin ningún conocimiento técnico y las piezas ya lo explican en términos de negocio.
  - id: latam_relevance
    name: Relevancia LATAM
    question: ¿Importa este tema a empresas y líderes de Latinoamérica?
    levels:
      0: Solo afecta a un mercado fuera de LATAM y no tiene traducción a la región.
      1: Es global, pero la evidencia no dice nada sobre su efecto o disponibilidad en LATAM.
      2: Es global y aplica en LATAM sin cambios (herramienta o práctica disponible en la región).
      3: Hay una razón concreta por la que importa en LATAM (idioma, coste, regulación, mercado), dicha en la evidencia.
      4: Alguna pieza trata el tema en un país o empresa latinoamericana.
      5: Varias piezas lo tratan en LATAM con casos, datos o regulación de la región.
  - id: pillar_fit
    name: Encaje con pilares 30X
    question: ¿Encaja el tema con alguno de los pilares del perfil de 30X?
    levels:
      0: Está en la lista de "qué no encaja" del perfil.
      1: No encaja con ningún pilar.
      2: Toca un pilar solo de pasada; habría que forzar el ángulo.
      3: Encaja con un pilar, pero sin el enfoque de operador del perfil (criterio, ejecución, resultados).
      4: Encaja con un pilar con enfoque de operador.
      5: Encaja con un pilar con enfoque de operador y conecta con un segundo pilar.
  - id: actionable_content
    name: Convertible en contenido accionable
    question: ¿Se puede convertir en una pieza que diga a un líder qué hacer (pasos, criterio, checklist)?
    levels:
      0: No hay nada que el líder pueda hacer con ello.
      1: Solo da para informar ("ha pasado X"), sin acción posible.
      2: Da para una reflexión u opinión, sin pasos concretos.
      3: Da para una recomendación general ("revisa tu política de X") sin pasos.
      4: Da para una guía con pasos o un criterio de decisión concreto.
      5: Da para una guía con pasos y la evidencia trae casos o cifras para ilustrarla.
