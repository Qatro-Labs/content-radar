[project]
name = "content-radar"
version = "0.1.0"
description = "30X Signal — radar de inteligencia editorial"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
    "tenacity>=9.0",
    "feedparser>=6.0",
    "structlog>=24.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "numpy>=2.5.4",
    "polars>=2.0.0",
    "mcp>=2.3.0",
    "typesafe-sdk==0.7.4",
]

[dependency-groups]
# Solo el job `analyze` calcula embeddings: la imagen de la API y el MCP no instala torch
# (`uv sync --no-group ml`).
ml = [
    "sentence-transformers>=6.1.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
default-groups = ["dev", "ml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Migraciones autogeneradas por Alembic.
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
# La carpeta local alembic/ no es el paquete alembic.
known-third-party = ["alembic"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
