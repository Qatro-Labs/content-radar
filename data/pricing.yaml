# Precios para el coste de operación (CLAUDE.md §4). Cada precio lleva su fuente.
# El coste se calcula al registrar cada consumo en usage_events, así que cambiar un precio aquí
# no altera el histórico. Si un precio cambia, se actualiza el valor, la fuente y checked_at.

currency: USD
checked_at: 2026-10-17

# Coste por unidad consumida.
variable:
  youtube:
    unit: quota_units
    price_per_unit: 0
    note: "Gratis: cupo propio de 100 llamadas/día a search.list (1 unidad cada una) y 10.000 unidades/día para el resto."
    source: https://developers.google.com/youtube/v3/getting-started#quota
  hackernews:
    unit: requests
    price_per_unit: 0
    source: https://hn.algolia.com/api
  rss:
    unit: requests
    price_per_unit: 0
  brave_search:
    unit: requests
    price_per_unit: 0.005 # 5 $ por 1.000 consultas
    free_credit_monthly: 5.00 # ≈ 1.000 consultas al mes
    source: https://brave.com/search/api/
  scrapecreators:
    # TikTok y Reddit. 1 crédito por llamada; paquete Freelance: 47 $ por 25.000 créditos, sin
    # caducidad (100 gratis al registrarse).
    unit: requests
    price_per_unit: 0.00188
    source: https://scrapecreators.com
  twitterapi:
    # X. 0,15 $ por 1.000 tweets devueltos (15 créditos por tweet, 1 $ = 100.000 créditos), con un
    # mínimo de un tweet por llamada.
    unit: tweets
    price_per_unit: 0.00015
    source: https://twitterapi.io/pricing
  typesafe_jev:
    unit: input_tokens
    price_per_unit: 0.000000042 # 0,042 $ por millón de tokens de entrada; la salida es gratis
    source: https://docs.typesafe.ai/models
  llm_text:
    # Modelo elegido el 17/10: claude-haiku-5-5 (plan intel-phase1-llm-fit, D1). Precio de los
    # prompts de hasta 100K tokens; evaluate_topic queda muy por debajo.
    unit: tokens
    model: claude-haiku-5-5
    input_price_per_unit: 0.0000001 # 0,10 $ por millón de tokens de entrada
    output_price_per_unit: 0.0000005 # 0,50 $ por millón de tokens de salida
    source: https://platform.claude.com/docs/en/about-claude/pricing
    candidates:
      claude-haiku-5-5:
        input_per_million: 0.10
        output_per_million: 0.50
        note: "Hasta 100K tokens de prompt; por encima, 0,50 / 2,50."
        source: https://platform.claude.com/docs/en/about-claude/pricing
      gpt-6-luna:
        input_per_million: 0.10
        output_per_million: 0.50
        note: "Precio de agregadores; confirmar en la web de OpenAI antes de elegirlo."
        source: https://benchlm.ai/openai/api-pricing
      claude-sonnet-5-5:
        input_per_million: 2.00
        output_per_million: 10.00
        source: https://platform.claude.com/docs/en/about-claude/pricing

# Coste mensual de los planes. "demo" es lo que usamos en la hackathon; "production" es lo que
# necesitaría 30X para uso comercial (Vercel Hobby no permite uso comercial).
fixed_monthly:
  demo:
    railway_hobby:
      monthly: 5.00
      note: "Incluye 5 $ de uso al mes; el exceso se paga aparte."
      source: https://railway.com/pricing
    supabase_free:
      monthly: 0
      note: "Pausa el proyecto tras 1 semana sin actividad."
      source: https://supabase.com/pricing
    vercel_hobby:
      monthly: 0
      note: "Solo uso personal no comercial."
      source: https://vercel.com/pricing
    github_actions:
      monthly: 0
      note: "Gratis en repositorios públicos."
      source: https://docs.github.com/en/billing/managing-billing-for-github-actions/about-billing-for-github-actions
  production:
    railway_hobby:
      monthly: 5.00
      note: "Incluye 5 $ de uso al mes; el exceso se paga aparte."
      source: https://railway.com/pricing
    supabase_pro:
      monthly: 25.00
      source: https://supabase.com/pricing
    vercel_pro:
      monthly: 20.00
      note: "Por usuario."
      source: https://vercel.com/pricing
    github_actions:
      monthly: 0
      note: "Gratis en repositorios públicos."
      source: https://docs.github.com/en/billing/managing-billing-for-github-actions/about-billing-for-github-actions
