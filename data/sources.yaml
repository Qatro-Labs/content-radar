# --- TikTok y Reddit vía ScrapeCreators (1 crédito por fuente y ejecución; requiere
# SCRAPECREATORS_API_KEY). Probados el 17/10. ---
tiktok:
  # query = búsqueda de la última semana. search_region = país de la búsqueda; item_regions deja
  # solo vídeos de esos países (la búsqueda desde MX también trae vídeos de España).
  - { query: "AI agents", segment: tech, language: en, region: global, ai_filter: true }
  - { query: "AI for business", segment: business, language: en, region: global, ai_filter: true }
  - query: "inteligencia artificial empresas"
    search_region: MX
    item_regions: &latam [MX, CO, AR, PE, CL, EC, VE, UY, PY, BO, GT, CR, DO, PA, SV, HN, NI, CU, PR]
    segment: latam_es
    language: es
    region: latam
    ai_filter: true
  - { query: "agentes de IA", search_region: CO, item_regions: *latam, segment: latam_es, language: es, region: latam, ai_filter: true }

reddit:
  # Posts top de la semana de cada subreddit. ai_filter: true en los que no sean solo de IA.
  - { subreddit: "artificial", segment: tech, language: en, region: global }
  - { subreddit: "OpenAI", segment: tech, language: en, region: global }
  - { subreddit: "ClaudeAI", segment: tech, language: en, region: global }
  - { subreddit: "LocalLLaMA", segment: tech, language: en, region: global }
  - { subreddit: "AI_Agents", segment: tech, language: en, region: global }
