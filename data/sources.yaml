# Fuentes iniciales del Signal Engine (CLAUDE.md §5).
# Carga: cd backend && uv run python -m app.jobs.seed_sources
#
# segment = para quién importa:
#   tech      → comunidad técnica / IA internacional (grupo A del LATAM Gap)
#   business  → negocio y management en inglés
#   latam_es  → contenido en español, LATAM y España (grupo B del LATAM Gap)
# region: ISO 3166 en minúsculas, o "latam" / "global".
# ai_filter: true → la fuente no es solo de IA; el collector descarta piezas sin términos de IA.
#
# Feeds RSS verificados con feedparser el 2026-10-16. Handles de YouTube verificados que
# existen; el loader los convierte a channel ID con la API oficial (requiere YOUTUBE_API_KEY).

