services:
  db:
    image: pgvector/pgvector:pg17
    container_name: content-radar-db
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar
    ports:
      - "5433:5432" # 5433 en el host para no chocar con otros Postgres locales
    volumes:
      - radar_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  radar_pg:
