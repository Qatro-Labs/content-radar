<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="985" viewBox="0 0 1200 985" role="img" aria-labelledby="t d"><title id="t">30X Signal · Componentes</title><desc id="d">Fuentes públicas, colectores, motor de análisis con modelos de IA, base de datos, servicios, API REST, agente Rad y servidor MCP, y los clientes: dashboard y asistentes de IA.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs><rect width="1200" height="985" fill="#ffffff"/><text x="40.0" y="58.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2328" text-anchor="start">30X Signal · Componentes</text><text x="40.0" y="90.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#57606a" text-anchor="start">Los jobs recolectan y analizan; una sola capa de servicios sirve el mismo ranking al dashboard, al agente y a los asistentes</text><text x="40.0" y="115.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#57606a" text-anchor="start">de IA.</text><rect x="40.0" y="151.3" width="1120.0" height="87.9" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="58.0" y="186.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#1f2328" text-anchor="start">Fuentes públicas</text><text x="58.0" y="211.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">YouTube · Hacker News · medios y blogs (RSS) · TikTok · Reddit · Instagram</text><line x1="213.3" y1="239.2" x2="213.3" y2="281.2" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40.0" y="283.2" width="346.7" height="111.1" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="58.0" y="317.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#0550ae" text-anchor="start">Colectores</text><text x="58.0" y="343.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Leen cada fuente y guardan piezas y</text><text x="58.0" y="366.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">métricas públicas.</text><rect x="426.7" y="283.2" width="346.7" height="111.1" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="444.7" y="317.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#0550ae" text-anchor="start">Motor de análisis</text><text x="444.7" y="343.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Agrupa las piezas en temas y calcula</text><text x="444.7" y="366.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">los scores.</text><rect x="813.3" y="283.2" width="346.7" height="111.1" rx="12" fill="#fff1e5" stroke="#fb8f44" stroke-width="1.5"/><text x="831.3" y="317.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#953800" text-anchor="start">Modelos de IA</text><text x="831.3" y="343.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Jev clasifica y verifica; el LLM</text><text x="831.3" y="366.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">evalúa y redacta.</text><line x1="811.3" y1="338.8" x2="775.3" y2="338.8" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><line x1="213.3" y1="394.3" x2="213.3" y2="436.3" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><line x1="600.0" y1="394.3" x2="600.0" y2="436.3" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40.0" y="438.3" width="1120.0" height="87.9" rx="12" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/><text x="58.0" y="473.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#116329" text-anchor="start">Base de datos</text><text x="58.0" y="498.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Piezas, métricas y cada ejecución del análisis con su ranking.</text><line x1="600.0" y1="526.2" x2="600.0" y2="568.2" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40.0" y="570.2" width="1120.0" height="87.9" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="58.0" y="604.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#0550ae" text-anchor="start">Servicios</text><text x="58.0" y="630.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">La única lógica de negocio: todos los canales leen los mismos datos.</text><line x1="213.3" y1="658.1" x2="213.3" y2="700.1" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><line x1="600.0" y1="658.1" x2="600.0" y2="700.1" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><line x1="986.7" y1="658.1" x2="986.7" y2="700.1" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40.0" y="702.1" width="346.7" height="111.1" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="58.0" y="736.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#0550ae" text-anchor="start">API REST</text><text x="58.0" y="762.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Sirve oportunidades, evidencia y</text><text x="58.0" y="785.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">briefs al dashboard.</text><rect x="426.7" y="702.1" width="346.7" height="111.1" rx="12" fill="#fff1e5" stroke="#fb8f44" stroke-width="1.5"/><text x="444.7" y="736.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#953800" text-anchor="start">Agente Rad</text><text x="444.7" y="762.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Responde preguntas sobre el Radar y</text><text x="444.7" y="785.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">mueve la vista.</text><rect x="813.3" y="702.1" width="346.7" height="111.1" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="831.3" y="736.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#0550ae" text-anchor="start">Servidor MCP</text><text x="831.3" y="762.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Las mismas consultas desde un</text><text x="831.3" y="785.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">asistente de IA.</text><line x1="213.3" y1="813.2" x2="213.3" y2="855.2" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><line x1="600.0" y1="813.2" x2="520.0" y2="855.2" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><line x1="986.7" y1="813.2" x2="986.7" y2="855.2" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40.0" y="857.2" width="540.0" height="87.9" rx="12" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/><text x="58.0" y="891.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#7d4e00" text-anchor="start">Dashboard</text><text x="58.0" y="917.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Radar, exploración de evidencia y creación de briefs.</text><rect x="620.0" y="857.2" width="540.0" height="87.9" rx="12" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/><text x="638.0" y="891.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#7d4e00" text-anchor="start">Asistentes de IA</text><text x="638.0" y="917.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Claude, ChatGPT o Grok, conectados por MCP.</text></svg>
