, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">evalúa y redacta.</text><line x1="811.3" y1="364.7" x2="775.3" y2="364.7" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><line x1="213.3" y1="428.9" x2="213.3" y2="470.9" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><line x1="600.0" y1="428.9" x2="600.0" y2="470.9" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40.0" y="472.9" width="1120.0" height="105.2" rx="12" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/><rect x="58.0" y="488.9" width="38.0" height="38.0" rx="10" fill="#ffffff" stroke="#4ac26b" stroke-width="1.5"/><g transform="translate(66.0 496.9) scale(0.9167)" fill="none" stroke="#116329" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M3 5V19A9 3 0 0 0 21 19V5" /><path d="M3 12A9 3 0 0 0 21 12" /></g><text x="108.0" y="515.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#116329" text-anchor="start">Base de datos</text><text x="58.0" y="552.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Piezas, métricas y cada ejecución del análisis con su ranking.</text><line x1="600.0" y1="578.1" x2="600.0" y2="620.1" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40.0" y="622.1" width="1120.0" height="105.2" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><rect x="58.0" y="638.1" width="38.0" height="38.0" rx="10" fill="#ffffff" stroke="#54aeff" stroke-width="1.5"/><g transform="translate(66.0 646.1) scale(0.9167)" fill="none" stroke="#0550ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0