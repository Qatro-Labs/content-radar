<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1089" viewBox="0 0 1200 1089" role="img" aria-labelledby="t d"><title id="t">30X Signal · Componentes</title><desc id="d">Fuentes públicas, colectores, motor de análisis con modelos de IA, base de datos, servicios, API REST, agente Rad y servidor MCP, y los clientes: dashboard y asistentes de IA.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs><rect width="1200" height="1089" fill="#ffffff"/><text x="40.0" y="58.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2328" text-anchor="start">30X Signal · Componentes</text><text x="40.0" y="90.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#57606a" text-anchor="start">Los jobs recolectan y analizan; una sola capa de servicios sirve el mismo ranking al dashboard, al agente y a los asistentes</text><text x="40.0" y="115.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#57606a" text-anchor="start">de IA.</text><rect x="40.0" y="151.3" width="1120.0" height="105.2" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><rect x="58.0" y="167.3" width="38.0" height="38.0" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><g transform="translate(66.0 175.3) scale(0.9167)" fill="none" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" /><path d="M2 12h20" /></g><text x="108.0" y="193.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#1f2328" text-anchor="start">Fuentes públicas</text><text x="58.0" y="230.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">YouTube · Hacker News · medios y blogs (RSS) · TikTok · Reddit · Instagram</text><line x1="213.3" y1="256.5" x2="213.3" y2="298.5" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40.0" y="300.5" width="346.7" height="128.4" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><rect x="58.0" y="316.5" width="38.0" height="38.0" rx="10" fill="#ffffff" stroke="#54aeff" stroke-width="1.5"/><g transform="translate(66.0 324.5) scale(0.9167)" fill="none" stroke="#0550ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" x2="12" y1="15" y2="3" /></g><text x="108.0" y="342.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#0550ae" text-anchor="start">Colectores</text><text x="58.0" y="380.1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Leen cada fuente y guardan piezas y</text><text x="58.0" y="403.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">métricas públicas.</text><rect x="426.7" y="300.5" width="346.7" height="128.4" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><rect x="444.7" y="316.5" width="38.0" height="38.0" rx="10" fill="#ffffff" stroke="#54aeff" stroke-width="1.5"/><g transform="translate(452.7 324.5) scale(0.9167)" fill="none" stroke="#0550ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="16" x="4" y="4" rx="2" /><rect width="6" height="6" x="9" y="9" rx="1" /><p