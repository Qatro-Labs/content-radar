<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="t d"><title id="t">30X Signal · De la señal al contenido</title><desc id="d">Cinco pasos: señal, tendencia, oportunidad, evidencia y contenido, con la pregunta que responde cada uno y la vista del dashboard donde se ve.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs><rect width="1200" height="490" fill="#ffffff"/><text x="40.0" y="58.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2328" text-anchor="start">30X Signal · De la señal al contenido</text><text x="40.0" y="90.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#57606a" text-anchor="start">Cada paso responde una pregunta. El dashboard y los asistentes de IA (por MCP) recorren los mismos pasos.</text><rect x="40.0" y="126.7" width="201.6" height="221.2" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><rect x="58.0" y="142.7" width="38.0" height="38.0" rx="10" fill="#ffffff" stroke="#54aeff" stroke-width="1.5"/><g transform="translate(66.0 150.7) scale(0.9167)" fill="none" stroke="#0550ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9" /><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5" /><circle cx="12" cy="12" r="2" /><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5" /><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19" /></g><text x="108.0" y="169.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#0550ae" text-anchor="start">Señal</text><text x="58.0" y="206.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Una pieza pública</text><text x="58.0" y="229.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">con sus métricas.</text><text x="58.0" y="252.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">¿Qué se publica?</text><line x1="243.6" y1="237.2" x2="267.6" y2="237.2" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="269.6" y="126.7" width="201.6" height="221.2" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><rect x="287.6" y="142.7" width="38.0" height="38.0" rx="10" fill="#ffffff" stroke="#54aeff" stroke-width="1.5"/><g transform="translate(295.6 150.7) scale(0.9167)" fill="none" stroke="#0550ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17" /><polyline points="16 7 22 7 22 13" /></g><text x="337.6" y="169.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#0550ae" text-anchor="start">Tendencia</text><text x="287.6" y="206.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Piezas parecidas</text><text x="287.6" y="229.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">agrupadas en un</text><text x="287.6" y="252.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">tema que crece.</text><text x="287.6" y="275.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">¿Qué está</text><text x="287.6" y="299.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">creciendo?</text><line x1="473.2" y1="237.2" x2="497.2" y2="237.2" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="499.2" y="126.7" width="201.6" height="221.2" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><rect x="517.2" y="142.7" width="38.0" height="38.0" rx="10" fill="#ffffff" stroke="#54aeff" stroke-width="1.5"/><g transform="translate(525.2 150.7) scale(0.9167)" fill="none" stroke="#0550ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><circle cx="12" cy="12" r="6" /><circle cx="12" cy="12" r="2" /></g><text x="567.2" y="169.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#0550ae" text-anchor="start">Oportunidad</text><text x="517.2" y="206.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">El tema puntuado</text><text x="517.2" y="229.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">para la audiencia</text><text x="517.2" y="252.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">de 30X, con una</text><text x="517.2" y="275.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">recomendación.</text><text x="517.2" y="299.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">¿Vale la pena?</text><line x1="702.8" y1="237.2" x2="726.8" y2="237.2" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="728.8" y="126.7" width="201.6" height="221.2" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><rect x="746.8" y="142.7" width="38.0" height="38.0" rx="10" fill="#ffffff" stroke="#54aeff" stroke-width="1.5"/><g transform="translate(754.8 150.7) scale(0.9167)" fill="none" stroke="#0550ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2v4a2 2 0 0 0 2 2h4" /><path d="M4.268 21a2 2 0 0 0 1.727 1H18a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v3" /><path d="m9 18-1.5-1.5" /><circle cx="5" cy="14" r="3" /></g><text x="796.8" y="169.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#0550ae" text-anchor="start">Evidencia</text><text x="746.8" y="206.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Las piezas que lo</text><text x="746.8" y="229.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">respaldan,</text><text x="746.8" y="252.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">enlazadas a su</text><text x="746.8" y="275.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">fuente.</text><text x="746.8" y="299.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">¿Por qué lo</text><text x="746.8" y="322.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">creemos?</text><line x1="932.4" y1="237.2" x2="956.4" y2="237.2" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="958.4" y="126.7" width="201.6" height="221.2" rx="12" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/><rect x="976.4" y="142.7" width="38.0" height="38.0" rx="10" fill="#ffffff" stroke="#4ac26b" stroke-width="1.5"/><g transform="translate(984.4 150.7) scale(0.9167)" fill="none" stroke="#116329" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9" /><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z" /></g><text x="1026.4" y="169.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#116329" text-anchor="start">Contenido</text><text x="976.4" y="206.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Un brief con</text><text x="976.4" y="229.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">ángulo, gancho y</text><text x="976.4" y="252.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">estructura.</text><text x="976.4" y="275.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">¿Qué publicamos?</text><text x="40.0" y="395.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#57606a" text-anchor="start">EN EL DASHBOARD</text><rect x="40.0" y="409.9" width="201.6" height="40.0" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/><text x="140.8" y="435.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7d4e00" text-anchor="middle">Explorar</text><rect x="269.6" y="409.9" width="431.2" height="40.0" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/><text x="485.2" y="435.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7d4e00" text-anchor="middle">Radar</text><rect x="728.8" y="409.9" width="201.6" height="40.0" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/><text x="829.6" y="435.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7d4e00" text-anchor="middle">Expediente del tema</text><rect x="958.4" y="409.9" width="201.6" height="40.0" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/><text x="1059.2" y="435.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7d4e00" text-anchor="middle">Crear</text></svg>
