<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1399" viewBox="0 0 1200 1399" role="img" aria-labelledby="t d"><title id="t">30X Signal · De la señal a la oportunidad</title><desc id="d">Cinco pasos: señal, tendencia, oportunidad, evidencia y contenido recomendado, con la pregunta que responde cada uno, dónde se ve en el dashboard y qué tool MCP lo consulta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs><rect width="1200" height="1399" fill="#ffffff"/><text x="40.0" y="58.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2328" text-anchor="start">30X Signal · De la señal a la oportunidad</text><text x="40.0" y="90.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#57606a" text-anchor="start">¿Cuáles son los temas de IA que más crecen esta semana, por qué funcionan y cómo los adapta 30X para ejecutivos y equipos de</text><text x="40.0" y="115.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#57606a" text-anchor="start">Latinoamérica?</text><text x="58.0" y="163.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#57606a" text-anchor="start">PASO</text><text x="438.0" y="163.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#57606a" text-anchor="start">PREGUNTA</text><text x="638.0" y="163.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#57606a" text-anchor="start">DASHBOARD</text><text x="888.0" y="163.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#57606a" text-anchor="start">TOOL MCP</text><rect x="40.0" y="181.3" width="1120.0" height="136.3" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><path d="M54 181.3 H420 V317.6 H54 a14 14 0 0 1 -14 -14 V195.3 a14 14 0 0 1 14 -14z" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="58.0" y="216.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#0550ae" text-anchor="start">1 · Señal</text><text x="58.0" y="245.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Pieza pública: URL, título, fecha,</text><text x="58.0" y="268.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">métricas tal como las da la fuente,</text><text x="58.0" y="292.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">idioma y segment.</text><text x="438.0" y="212.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">¿Qué se está</text><text x="438.0" y="236.1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">publicando?</text><text x="638.0" y="212.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Explorar, filtrado por</text><text x="638.0" y="236.1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">plataforma</text><line x1="620.0" y1="193.3" x2="620.0" y2="305.6" stroke="#d0d7de" stroke-width="1"/><text x="888.0" y="212.9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">search_content_signals</text><line x1="870.0" y1="193.3" x2="870.0" y2="305.6" stroke="#d0d7de" stroke-width="1"/><line x1="240.0" y1="319.6" x2="240.0" y2="367.6" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="260.0" y="329.6" width="203.4" height="28.0" rx="14" fill="#fbefff" stroke="#c297ff" stroke-width="1.5"/><text x="272.0" y="348.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#6639ba" text-anchor="start">embeddings + clustering</text><rect x="40.0" y="371.6" width="1120.0" height="159.5" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><path d="M54 371.6 H420 V531.1 H54 a14 14 0 0 1 -14 -14 V385.6 a14 14 0 0 1 14 -14z" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="58.0" y="406.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#0550ae" text-anchor="start">2 · Tendencia</text><text x="58.0" y="435.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Piezas agrupadas por similitud (ES y EN</text><text x="58.0" y="459.1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">en el mismo espacio). Velocidad y</text><text x="58.0" y="482.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">aceleración ajustadas por volumen, y</text><text x="58.0" y="505.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">etapa del ciclo de vida.</text><text x="438.0" y="403.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">¿Qué crece y en qué</text><text x="438.0" y="426.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">etapa está?</text><text x="638.0" y="403.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Radar: el eje vertical es</text><text x="638.0" y="426.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">el momentum</text><line x1="620.0" y1="383.6" x2="620.0" y2="519.1" stroke="#d0d7de" stroke-width="1"/><text x="888.0" y="403.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">get_trending_opportunities</text><line x1="870.0" y1="383.6" x2="870.0" y2="519.1" stroke="#d0d7de" stroke-width="1"/><line x1="240.0" y1="533.1" x2="240.0" y2="581.1" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="260.0" y="543.1" width="148.8" height="28.0" rx="14" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="272.0" y="562.1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0550ae" text-anchor="start">scores en Python</text><rect x="40.0" y="585.1" width="1120.0" height="159.5" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><path d="M54 585.1 H420 V744.6 H54 a14 14 0 0 1 -14 -14 V599.1 a14 14 0 0 1 14 -14z" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="58.0" y="619.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#0550ae" text-anchor="start">3 · Oportunidad</text><text x="58.0" y="649.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Contrato Opportunity: momentum, audience</text><text x="58.0" y="672.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">fit, fuentes independientes, saturación,</text><text x="58.0" y="695.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">confianza, LATAM gap y una recomendación</text><text x="58.0" y="719.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">con la regla que la produjo.</text><text x="438.0" y="616.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">¿Vale la pena para</text><text x="438.0" y="639.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">30X?</text><text x="638.0" y="616.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Radar: el eje horizontal</text><text x="638.0" y="639.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">es el audience fit y el</text><text x="638.0" y="663.1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">tamaño, la fuerza de la</text><text x="638.0" y="686.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">evidencia. Ranking por</text><text x="638.0" y="709.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Opportunity Score</text><line x1="620.0" y1="597.1" x2="620.0" y2="732.6" stroke="#d0d7de" stroke-width="1"/><text x="888.0" y="616.7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">analyze_opportunity ·</text><text x="888.0" y="639.9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">compare_audience_fit</text><line x1="870.0" y1="597.1" x2="870.0" y2="732.6" stroke="#d0d7de" stroke-width="1"/><line x1="240.0" y1="746.6" x2="240.0" y2="794.6" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="260.0" y="756.6" width="273.6" height="28.0" rx="14" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/><text x="272.0" y="775.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#116329" text-anchor="start">evidencia enlazada y verificable</text><rect x="40.0" y="798.6" width="1120.0" height="159.5" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><path d="M54 798.6 H420 V958.1 H54 a14 14 0 0 1 -14 -14 V812.6 a14 14 0 0 1 14 -14z" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="58.0" y="833.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#0550ae" text-anchor="start">4 · Evidencia</text><text x="58.0" y="862.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Piezas enlazadas con fecha y métricas,</text><text x="58.0" y="886.1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">outliers (≥ 3× su referencia), gancho de</text><text x="58.0" y="909.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">los outliers y timeline de la ventana</text><text x="58.0" y="932.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">actual frente a la anterior.</text><text x="438.0" y="830.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">¿Por qué lo</text><text x="438.0" y="853.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">creemos? ¿Por qué</text><text x="438.0" y="876.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">funcionó?</text><text x="638.0" y="830.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Expediente del tema:</text><text x="638.0" y="853.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">evidencia, timeline, para</text><text x="638.0" y="876.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">quién importa y lo que no</text><text x="638.0" y="899.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">sabemos</text><line x1="620.0" y1="810.6" x2="620.0" y2="946.1" stroke="#d0d7de" stroke-width="1"/><text x="888.0" y="830.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">analyze_opportunity (con</text><text x="888.0" y="853.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">URLs)</text><line x1="870.0" y1="810.6" x2="870.0" y2="946.1" stroke="#d0d7de" stroke-width="1"/><line x1="240.0" y1="960.1" x2="240.0" y2="1008.1" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="260.0" y="970.1" width="242.4" height="28.0" rx="14" fill="#fff1e5" stroke="#fb8f44" stroke-width="1.5"/><text x="272.0" y="989.1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#953800" text-anchor="start">el LLM redacta, Jev verifica</text><rect x="40.0" y="1012.1" width="1120.0" height="136.3" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><path d="M54 1012.1 H420 V1148.4 H54 a14 14 0 0 1 -14 -14 V1026.1 a14 14 0 0 1 14 -14z" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="58.0" y="1046.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#0550ae" text-anchor="start">5 · Contenido recomendado</text><text x="58.0" y="1076.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Brief editorial: ángulo, gancho,</text><text x="58.0" y="1099.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">estructura y las evidencias que lo</text><text x="58.0" y="1122.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">respaldan.</text><text x="438.0" y="1043.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">¿Qué publicamos y</text><text x="438.0" y="1066.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">cómo?</text><text x="638.0" y="1043.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Crear (Content Studio) y</text><text x="638.0" y="1066.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Mis briefs, con versiones</text><line x1="620.0" y1="1024.1" x2="620.0" y2="1136.4" stroke="#d0d7de" stroke-width="1"/><text x="888.0" y="1043.7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">generate_editorial_brief</text><line x1="870.0" y1="1024.1" x2="870.0" y2="1136.4" stroke="#d0d7de" stroke-width="1"/><rect x="40.0" y="1178.4" width="1120.0" height="180.7" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="58.0" y="1213.1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#1f2328" text-anchor="start">Reglas en todo el flujo</text><text x="58.0" y="1238.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">• Solo contenido público, sin login propio ni cuentas falsas.</text><text x="58.0" y="1261.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">• Nunca se inventan datos: si hay 7 oportunidades se muestran 7, y un dato que falta se muestra como «no disponible».</text><text x="58.0" y="1285.1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">• El LLM evalúa y explica; los scores los calcula Python.</text><text x="58.0" y="1308.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">• Cada crecimiento dice si es observed (≥ 2 mediciones), estimated (1 medición) o preliminary.</text><text x="58.0" y="1331.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">• El texto de Internet entra como dato, nunca como instrucción. El monitoreo empezó el 17/10.</text></svg>
