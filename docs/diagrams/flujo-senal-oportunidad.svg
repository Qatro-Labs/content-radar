<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="473" viewBox="0 0 1200 473" role="img" aria-labelledby="t d"><title id="t">30X Signal · De la señal al contenido</title><desc id="d">Cinco pasos: señal, tendencia, oportunidad, evidencia y contenido, con la pregunta que responde cada uno y la vista del dashboard donde se ve.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs><rect width="1200" height="473" fill="#ffffff"/><text x="40.0" y="58.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2328" text-anchor="start">30X Signal · De la señal al contenido</text><text x="40.0" y="90.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#57606a" text-anchor="start">Cada paso responde una pregunta. El dashboard y los asistentes de IA (por MCP) recorren los mismos pasos.</text><rect x="40.0" y="126.7" width="201.6" height="203.9" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="58.0" y="161.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#0550ae" text-anchor="start">1 · Señal</text><text x="58.0" y="186.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Una pieza pública</text><text x="58.0" y="210.1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">con sus métricas.</text><text x="58.0" y="233.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">¿Qué se publica?</text><line x1="243.6" y1="228.6" x2="267.6" y2="228.6" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="269.6" y="126.7" width="201.6" height="203.9" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="287.6" y="161.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#0550ae" text-anchor="start">2 · Tendencia</text><text x="287.6" y="186.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Piezas parecidas</text><text x="287.6" y="210.1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">agrupadas en un</text><text x="287.6" y="233.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">tema que crece.</text><text x="287.6" y="256.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">¿Qué está</text><text x="287.6" y="279.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">creciendo?</text><line x1="473.2" y1="228.6" x2="497.2" y2="228.6" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="499.2" y="126.7" width="201.6" height="203.9" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="517.2" y="161.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#0550ae" text-anchor="start">3 · Oportunidad</text><text x="517.2" y="186.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">El tema puntuado</text><text x="517.2" y="210.1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">para la audiencia</text><text x="517.2" y="233.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">de 30X, con una</text><text x="517.2" y="256.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">recomendación.</text><text x="517.2" y="279.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">¿Vale la pena?</text><line x1="702.8" y1="228.6" x2="726.8" y2="228.6" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="728.8" y="126.7" width="201.6" height="203.9" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="746.8" y="161.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#0550ae" text-anchor="start">4 · Evidencia</text><text x="746.8" y="186.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Las piezas que lo</text><text x="746.8" y="210.1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">respaldan,</text><text x="746.8" y="233.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">enlazadas a su</text><text x="746.8" y="256.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">fuente.</text><text x="746.8" y="279.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">¿Por qué lo</text><text x="746.8" y="302.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">creemos?</text><line x1="932.4" y1="228.6" x2="956.4" y2="228.6" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="958.4" y="126.7" width="201.6" height="203.9" rx="12" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/><text x="976.4" y="161.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#116329" text-anchor="start">5 · Contenido</text><text x="976.4" y="186.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Un brief con</text><text x="976.4" y="210.1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">ángulo, gancho y</text><text x="976.4" y="233.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">estructura.</text><text x="976.4" y="256.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1f2328" text-anchor="start">¿Qué publicamos?</text><text x="40.0" y="378.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#57606a" text-anchor="start">EN EL DASHBOARD</text><rect x="40.0" y="392.5" width="201.6" height="40.0" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/><text x="140.8" y="418.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7d4e00" text-anchor="middle">Explorar</text><rect x="269.6" y="392.5" width="431.2" height="40.0" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/><text x="485.2" y="418.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7d4e00" text-anchor="middle">Radar</text><rect x="728.8" y="392.5" width="201.6" height="40.0" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/><text x="829.6" y="418.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7d4e00" text-anchor="middle">Expediente del tema</text><rect x="958.4" y="392.5" width="201.6" height="40.0" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/><text x="1059.2" y="418.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7d4e00" text-anchor="middle">Crear</text></svg>
