<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1094" viewBox="0 0 1200 1094" role="img" aria-labelledby="t d"><title id="t">30X Signal · Pipeline de análisis</title><desc id="d">Seis pasos, de las piezas públicas al ranking: clasificar, agrupar, medir, evaluar, decidir y explicar, con quién hace cada uno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs><rect width="1200" height="1094" fill="#ffffff"/><text x="40.0" y="58.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2328" text-anchor="start">30X Signal · Pipeline de análisis</text><text x="40.0" y="90.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#57606a" text-anchor="start">Velocidad, no popularidad. Python calcula todos los scores; los modelos de IA clasifican, evalúan y redactan.</text><rect x="40.0" y="126.7" width="1120.0" height="87.9" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="58.0" y="161.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#1f2328" text-anchor="start">Entrada</text><text x="58.0" y="186.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Piezas públicas de los últimos 14 días, con sus métricas.</text><line x1="600.0" y1="216.6" x2="600.0" y2="244.6" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40.0" y="246.6" width="1120.0" height="87.9" rx="12" fill="#fbefff" stroke="#c297ff" stroke-width="1.5"/><text x="58.0" y="281.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#6639ba" text-anchor="start">1 · Clasificar</text><rect x="1099.7" y="262.6" width="42.3" height="26.0" rx="13" fill="#ffffff" stroke="#c297ff" stroke-width="1.5"/><text x="1120.9" y="280.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6639ba" text-anchor="middle">Jev</text><text x="58.0" y="306.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Decide si cada pieza trata de IA y etiqueta su formato y su gancho.</text><line x1="600.0" y1="336.5" x2="600.0" y2="364.5" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40.0" y="366.5" width="1120.0" height="87.9" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="58.0" y="401.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#1f2328" text-anchor="start">2 · Agrupar</text><rect x="1052.4" y="382.5" width="89.6" height="26.0" rx="13" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="1097.2" y="400.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Embeddings</text><text x="58.0" y="426.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Une las piezas parecidas en temas, en español y en inglés.</text><line x1="600.0" y1="456.4" x2="600.0" y2="484.4" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40.0" y="486.4" width="1120.0" height="87.9" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="58.0" y="521.1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#0550ae" text-anchor="start">3 · Medir</text><rect x="1079.4" y="502.4" width="62.6" height="26.0" rx="13" fill="#ffffff" stroke="#54aeff" stroke-width="1.5"/><text x="1110.7" y="520.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0550ae" text-anchor="middle">Python</text><text x="58.0" y="546.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Velocidad, aceleración, outliers, saturación y fuentes independientes de cada tema.</text><line x1="600.0" y1="576.2" x2="600.0" y2="604.2" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40.0" y="606.2" width="1120.0" height="87.9" rx="12" fill="#fff1e5" stroke="#fb8f44" stroke-width="1.5"/><text x="58.0" y="641.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#953800" text-anchor="start">4 · Evaluar</text><rect x="1099.7" y="622.2" width="42.3" height="26.0" rx="13" fill="#ffffff" stroke="#fb8f44" stroke-width="1.5"/><text x="1120.9" y="640.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#953800" text-anchor="middle">LLM</text><text x="58.0" y="666.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Encaje del tema con la audiencia de 30X, en seis criterios.</text><line x1="600.0" y1="696.1" x2="600.0" y2="724.1" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40.0" y="726.1" width="1120.0" height="87.9" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><text x="58.0" y="760.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#0550ae" text-anchor="start">5 · Decidir</text><rect x="1079.4" y="742.1" width="62.6" height="26.0" rx="13" fill="#ffffff" stroke="#54aeff" stroke-width="1.5"/><text x="1110.7" y="760.1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0550ae" text-anchor="middle">Python</text><text x="58.0" y="786.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Opportunity Score, confianza y recomendación.</text><line x1="600.0" y1="816.0" x2="600.0" y2="844.0" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40.0" y="846.0" width="1120.0" height="87.9" rx="12" fill="#fff1e5" stroke="#fb8f44" stroke-width="1.5"/><text x="58.0" y="880.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#953800" text-anchor="start">6 · Explicar</text><rect x="1059.2" y="862.0" width="82.8" height="26.0" rx="13" fill="#ffffff" stroke="#fb8f44" stroke-width="1.5"/><text x="1100.6" y="880.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#953800" text-anchor="middle">LLM + Jev</text><text x="58.0" y="906.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">El LLM redacta por qué importa; Jev verifica cada afirmación.</text><line x1="600.0" y1="935.9" x2="600.0" y2="963.9" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40.0" y="965.9" width="1120.0" height="87.9" rx="12" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/><text x="58.0" y="1000.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#116329" text-anchor="start">Salida: ranking de oportunidades</text><text x="58.0" y="1026.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Cada tema con su evidencia y una recomendación: publicar ya · buscar ángulo · esperar caso · descartar.</text></svg>
