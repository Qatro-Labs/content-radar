<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1232" viewBox="0 0 1200 1232" role="img" aria-labelledby="t d"><title id="t">30X Signal · Pipeline de análisis</title><desc id="d">Seis pasos, de las piezas públicas al ranking: clasificar, agrupar, medir, evaluar, decidir y explicar, con quién hace cada uno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs><rect width="1200" height="1232" fill="#ffffff"/><text x="40.0" y="58.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2328" text-anchor="start">30X Signal · Pipeline de análisis</text><text x="40.0" y="90.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#57606a" text-anchor="start">Velocidad, no popularidad. Python calcula todos los scores; los modelos de IA clasifican, evalúan y redactan.</text><rect x="40.0" y="126.7" width="1120.0" height="105.2" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><rect x="58.0" y="142.7" width="38.0" height="38.0" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><g transform="translate(66.0 150.7) scale(0.9167)" fill="none" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12" /><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" /></g><text x="108.0" y="169.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#1f2328" text-anchor="start">Entrada</text><text x="58.0" y="206.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Piezas públicas de los últimos 14 días, con sus métricas.</text><line x1="600.0" y1="233.9" x2="600.0" y2="261.9" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40.0" y="263.9" width="1120.0" height="105.2" rx="12" fill="#fbefff" stroke="#c297ff" stroke-width="1.5"/><rect x="58.0" y="279.9" width="38.0" height="38.0" rx="10" fill="#ffffff" stroke="#c297ff" stroke-width="1.5"/><g transform="translate(66.0 287.9) scale(0.9167)" fill="none" stroke="#6639ba" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5 6.3 6.3a2.4 2.4 0 0 1 0 3.4L17 19" /><path d="M9.586 5.586A2 2 0 0 0 8.172 5H3a1 1 0 0 0-1 1v5.172a2 2 0 0 0 .586 1.414L8.29 18.29a2.426 2.426 0 0 0 3.42 0l3.58-3.58a2.426 2.426 0 0 0 0-3.42z" /><circle cx="6.5" cy="9.5" r=".5" fill="currentColor" /></g><text x="108.0" y="306.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#6639ba" text-anchor="start">1 · Clasificar</text><rect x="1099.7" y="285.9" width="42.3" height="26.0" rx="13" fill="#ffffff" stroke="#c297ff" stroke-width="1.5"/><text x="1120.9" y="303.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#6639ba" text-anchor="middle">Jev</text><text x="58.0" y="343.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Decide si cada pieza trata de IA y etiqueta su formato y su gancho.</text><line x1="600.0" y1="371.1" x2="600.0" y2="399.1" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40.0" y="401.1" width="1120.0" height="105.2" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><rect x="58.0" y="417.1" width="38.0" height="38.0" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><g transform="translate(66.0 425.1) scale(0.9167)" fill="none" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5c0-1.1.9-2 2-2h2" /><path d="M17 3h2c1.1 0 2 .9 2 2v2" /><path d="M21 17v2c0 1.1-.9 2-2 2h-2" /><path d="M7 21H5c-1.1 0-2-.9-2-2v-2" /><rect width="7" height="5" x="7" y="7" rx="1" /><rect width="7" height="5" x="10" y="12" rx="1" /></g><text x="108.0" y="443.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#1f2328" text-anchor="start">2 · Agrupar</text><rect x="1052.4" y="423.1" width="89.6" height="26.0" rx="13" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="1097.2" y="441.1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Embeddings</text><text x="58.0" y="480.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Une las piezas parecidas en temas, en español y en inglés.</text><line x1="600.0" y1="508.2" x2="600.0" y2="536.2" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40.0" y="538.2" width="1120.0" height="105.2" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><rect x="58.0" y="554.2" width="38.0" height="38.0" rx="10" fill="#ffffff" stroke="#54aeff" stroke-width="1.5"/><g transform="translate(66.0 562.2) scale(0.9167)" fill="none" stroke="#0550ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4" /><path d="M3.34 19a10 10 0 1 1 17.32 0" /></g><text x="108.0" y="580.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#0550ae" text-anchor="start">3 · Medir</text><rect x="1079.4" y="560.2" width="62.6" height="26.0" rx="13" fill="#ffffff" stroke="#54aeff" stroke-width="1.5"/><text x="1110.7" y="578.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0550ae" text-anchor="middle">Python</text><text x="58.0" y="617.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Velocidad, aceleración, outliers, saturación y fuentes independientes de cada tema.</text><line x1="600.0" y1="645.5" x2="600.0" y2="673.5" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40.0" y="675.5" width="1120.0" height="105.2" rx="12" fill="#fff1e5" stroke="#fb8f44" stroke-width="1.5"/><rect x="58.0" y="691.5" width="38.0" height="38.0" rx="10" fill="#ffffff" stroke="#fb8f44" stroke-width="1.5"/><g transform="translate(66.0 699.5) scale(0.9167)" fill="none" stroke="#953800" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" /><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z" /><path d="M7 21h10" /><path d="M12 3v18" /><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2" /></g><text x="108.0" y="717.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#953800" text-anchor="start">4 · Evaluar</text><rect x="1099.7" y="697.5" width="42.3" height="26.0" rx="13" fill="#ffffff" stroke="#fb8f44" stroke-width="1.5"/><text x="1120.9" y="715.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#953800" text-anchor="middle">LLM</text><text x="58.0" y="755.1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Encaje del tema con la audiencia de 30X, en seis criterios.</text><line x1="600.0" y1="782.7" x2="600.0" y2="810.7" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40.0" y="812.7" width="1120.0" height="105.2" rx="12" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/><rect x="58.0" y="828.7" width="38.0" height="38.0" rx="10" fill="#ffffff" stroke="#54aeff" stroke-width="1.5"/><g transform="translate(66.0 836.7) scale(0.9167)" fill="none" stroke="#0550ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12h11" /><path d="M10 18h11" /><path d="M10 6h11" /><path d="M4 10h2" /><path d="M4 6h1v4" /><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1" /></g><text x="108.0" y="855.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#0550ae" text-anchor="start">5 · Decidir</text><rect x="1079.4" y="834.7" width="62.6" height="26.0" rx="13" fill="#ffffff" stroke="#54aeff" stroke-width="1.5"/><text x="1110.7" y="852.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0550ae" text-anchor="middle">Python</text><text x="58.0" y="892.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Opportunity Score, confianza y recomendación.</text><line x1="600.0" y1="919.9" x2="600.0" y2="947.9" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40.0" y="949.9" width="1120.0" height="105.2" rx="12" fill="#fff1e5" stroke="#fb8f44" stroke-width="1.5"/><rect x="58.0" y="965.9" width="38.0" height="38.0" rx="10" fill="#ffffff" stroke="#fb8f44" stroke-width="1.5"/><g transform="translate(66.0 973.9) scale(0.9167)" fill="none" stroke="#953800" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /><path d="m9 12 2 2 4-4" /></g><text x="108.0" y="992.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#953800" text-anchor="start">6 · Explicar</text><rect x="1059.2" y="971.9" width="82.8" height="26.0" rx="13" fill="#ffffff" stroke="#fb8f44" stroke-width="1.5"/><text x="1100.6" y="989.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#953800" text-anchor="middle">LLM + Jev</text><text x="58.0" y="1029.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">El LLM redacta por qué importa; Jev verifica cada afirmación.</text><line x1="600.0" y1="1057.1" x2="600.0" y2="1085.1" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40.0" y="1087.1" width="1120.0" height="105.2" rx="12" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/><rect x="58.0" y="1103.1" width="38.0" height="38.0" rx="10" fill="#ffffff" stroke="#4ac26b" stroke-width="1.5"/><g transform="translate(66.0 1111.1) scale(0.9167)" fill="none" stroke="#116329" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" /><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" /><path d="M4 22h16" /><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" /><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" /><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" /></g><text x="108.0" y="1129.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#116329" text-anchor="start">Salida: ranking de oportunidades</text><text x="58.0" y="1166.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#1f2328" text-anchor="start">Cada tema con su evidencia y una recomendación: publicar ya · buscar ángulo · esperar caso · descartar.</text></svg>
